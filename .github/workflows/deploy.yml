name: Deploy

on:
  push:
    branches: [main]
    paths: ["site/**"]

permissions:
  id-token: write # OIDC token for AWS
  contents: read

# Never run two deploys at once; queue instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  SITE_BUCKET: nyt-game-solvers-site-159820161626

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::159820161626:role/nyt-game-solvers-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync site content to S3
        run: aws s3 sync site/ "s3://${{ env.SITE_BUCKET }}" --delete

      - name: Site URL
        run: echo "Deployed to http://${{ env.SITE_BUCKET }}.s3-website-${{ env.AWS_REGION }}.amazonaws.com"
