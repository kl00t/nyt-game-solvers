name: Deploy

on:
  push:
    branches: [main]
    paths: ["site/**"]

permissions:
  id-token: write # OIDC token for AWS
  contents: read

# Never run two deploys at once; queue instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  SITE_BUCKET: nyt-game-solvers-site-159820161626

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Branch protection can't be enforced on a private repo on the free
      # plan, so guard here: PR merge commits have committer "GitHub"; a
      # direct push to main does not — fail loudly instead of deploying
      # unreviewed content. (Accident-net, not tamper-proof.)
      - name: Require PR merge commit
        if: github.event.head_commit.committer.name != 'GitHub'
        run: |
          echo "::error::Direct push to main detected — refusing to deploy. Open a PR and merge it."
          exit 1

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::159820161626:role/nyt-game-solvers-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync site content to S3
        run: aws s3 sync site/ "s3://${{ env.SITE_BUCKET }}" --delete

      - name: Site URL
        run: echo "Deployed to http://${{ env.SITE_BUCKET }}.s3-website-${{ env.AWS_REGION }}.amazonaws.com"
