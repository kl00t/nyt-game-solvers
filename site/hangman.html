<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hangman</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    h1 {
      color: #e94560;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-size: 1.6rem;
      margin-bottom: 4px;
    }
    .category {
      color: #a8dadc;
      font-size: 0.9rem;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }
    .category b { text-transform: uppercase; }

    .stage {
      display: flex;
      gap: 28px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 12px;
    }
    svg { display: block; }
    .draw { stroke: #a8dadc; stroke-width: 4; stroke-linecap: round; fill: none; }
    .part { stroke: #eee; visibility: hidden; }
    .part.show { visibility: visible; }
    .dead .part.show { stroke: #e94560; }

    .status-panel { text-align: center; min-width: 200px; }
    .lives {
      font-size: 0.9rem;
      color: #a8dadc;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .lives .hearts { letter-spacing: 3px; }
    .scoreline {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 8px;
    }
    .message {
      font-size: 1.05rem;
      font-weight: bold;
      min-height: 1.6em;
      margin-bottom: 8px;
    }
    .message.win { color: #4caf87; }
    .message.lose { color: #e94560; }
    button.play-again {
      background: #e94560;
      border: none;
      color: #fff;
      font: inherit;
      font-weight: bold;
      padding: 10px 22px;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 1px;
      visibility: hidden;
    }
    button.play-again.show { visibility: visible; }
    button.play-again:hover { background: #d13551; }

    .word {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 18px 0 22px;
    }
    .slot {
      width: 34px;
      height: 44px;
      border-bottom: 3px solid #a8dadc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: bold;
      text-transform: uppercase;
    }
    .slot.revealed-miss { color: #e94560; border-bottom-color: #e94560; }

    .keyboard {
      display: flex;
      flex-direction: column;
      gap: 7px;
      align-items: center;
    }
    .krow { display: flex; gap: 6px; }
    .key {
      background: #16213e;
      border: 1px solid #0f3460;
      color: #eee;
      width: 38px;
      height: 46px;
      border-radius: 6px;
      font: inherit;
      font-weight: bold;
      font-size: 1rem;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.12s, transform 0.05s;
    }
    .key:hover:not(:disabled) { background: #0f3460; }
    .key:active:not(:disabled) { transform: scale(0.93); }
    .key:disabled { cursor: default; opacity: 0.9; }
    .key.hit { background: #0d3b2e; border-color: #4caf87; color: #4caf87; }
    .key.miss { background: #3b0d0d; border-color: #e94560; color: #e94560; opacity: 0.6; }

    .footer-note { color: #666; font-size: 0.75rem; margin-top: 20px; text-align: center; }

    @media (max-width: 480px) {
      .key { width: 30px; height: 42px; font-size: 0.9rem; }
      .slot { width: 26px; height: 38px; font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <h1>Hangman</h1>
  <p class="category">Category: <b id="category">—</b></p>

  <div class="stage">
    <svg id="gallows" width="180" height="200" viewBox="0 0 180 200" aria-hidden="true">
      <!-- gallows (always visible) -->
      <line class="draw" x1="20" y1="190" x2="120" y2="190"/>
      <line class="draw" x1="50" y1="190" x2="50" y2="20"/>
      <line class="draw" x1="48" y1="20" x2="130" y2="20"/>
      <line class="draw" x1="130" y1="20" x2="130" y2="42"/>
      <!-- body parts, revealed per wrong guess -->
      <circle class="draw part" id="p0" cx="130" cy="60" r="18"/>
      <line   class="draw part" id="p1" x1="130" y1="78" x2="130" y2="128"/>
      <line   class="draw part" id="p2" x1="130" y1="92" x2="104" y2="112"/>
      <line   class="draw part" id="p3" x1="130" y1="92" x2="156" y2="112"/>
      <line   class="draw part" id="p4" x1="130" y1="128" x2="108" y2="162"/>
      <line   class="draw part" id="p5" x1="130" y1="128" x2="152" y2="162"/>
    </svg>

    <div class="status-panel">
      <div class="lives">Lives: <span class="hearts" id="hearts"></span></div>
      <div class="scoreline">Wins: <span id="wins">0</span> &middot; Streak: <span id="streak">0</span></div>
      <div class="message" id="message"></div>
      <button class="play-again" id="playAgain">Play again</button>
    </div>
  </div>

  <div class="word" id="word"></div>
  <div class="keyboard" id="keyboard"></div>

  <p class="footer-note">Type on your keyboard or tap the letters. Six wrong guesses and it's game over.</p>

<script>
(function () {
  "use strict";

  const WORDS = {
    Animals: ["ELEPHANT","GIRAFFE","PENGUIN","DOLPHIN","KANGAROO","OCTOPUS","HEDGEHOG","FLAMINGO","SQUIRREL","CROCODILE","BUTTERFLY","RHINOCEROS","CHIMPANZEE","ARMADILLO","WOLVERINE"],
    Food: ["SPAGHETTI","PANCAKES","AVOCADO","CROISSANT","SANDWICH","BROCCOLI","CHOCOLATE","DUMPLINGS","MUSHROOM","PINEAPPLE","LASAGNE","OMELETTE","CUCUMBER","MERINGUE","GAZPACHO"],
    Countries: ["PORTUGAL","THAILAND","ARGENTINA","MOROCCO","ICELAND","VIETNAM","AUSTRALIA","SWITZERLAND","MADAGASCAR","COLOMBIA","SINGAPORE","KAZAKHSTAN","URUGUAY","SLOVENIA","PHILIPPINES"],
    Sports: ["BADMINTON","SNOOKER","VOLLEYBALL","GYMNASTICS","ARCHERY","TRIATHLON","LACROSSE","SKATEBOARDING","FENCING","HANDBALL","CURLING","ROWING","SQUASH","BIATHLON","NETBALL"],
    Occupations: ["ARCHITECT","PLUMBER","JOURNALIST","PHARMACIST","ELECTRICIAN","ASTRONAUT","LIBRARIAN","CARPENTER","DETECTIVE","PARAMEDIC","ZOOKEEPER","MAGICIAN","SURVEYOR","BEEKEEPER","LIGHTHOUSE KEEPER"]
  };
  const MAX_WRONG = 6;
  const KEY_ROWS = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];

  const $ = (id) => document.getElementById(id);
  const categoryEl = $("category"), heartsEl = $("hearts"), messageEl = $("message");
  const wordEl = $("word"), keyboardEl = $("keyboard"), playAgainBtn = $("playAgain");
  const gallowsEl = $("gallows"), winsEl = $("wins"), streakEl = $("streak");

  let answer = "", category = "", guessed = new Set(), wrong = 0, over = false;
  let stats = { wins: 0, streak: 0 };

  try {
    const saved = JSON.parse(localStorage.getItem("hangman-stats"));
    if (saved && typeof saved.wins === "number") stats = saved;
  } catch (e) { /* fresh start */ }

  function saveStats() {
    try { localStorage.setItem("hangman-stats", JSON.stringify(stats)); } catch (e) {}
  }

  function newGame() {
    const cats = Object.keys(WORDS);
    category = cats[Math.floor(Math.random() * cats.length)];
    const list = WORDS[category];
    answer = list[Math.floor(Math.random() * list.length)];
    guessed = new Set();
    wrong = 0;
    over = false;
    messageEl.textContent = "";
    messageEl.className = "message";
    playAgainBtn.classList.remove("show");
    gallowsEl.parentElement.classList.remove("dead");
    render();
  }

  function isWon() {
    return [...answer].every((ch) => ch === " " || guessed.has(ch));
  }

  function guess(letter) {
    if (over || guessed.has(letter)) return;
    guessed.add(letter);
    if (!answer.includes(letter)) wrong++;

    if (isWon()) {
      over = true;
      stats.wins++; stats.streak++;
      saveStats();
      messageEl.textContent = "🎉 You got it!";
      messageEl.className = "message win";
      playAgainBtn.classList.add("show");
    } else if (wrong >= MAX_WRONG) {
      over = true;
      stats.streak = 0;
      saveStats();
      messageEl.textContent = "The word was " + answer + ".";
      messageEl.className = "message lose";
      playAgainBtn.classList.add("show");
      gallowsEl.parentElement.classList.add("dead");
    }
    render();
  }

  function render() {
    categoryEl.textContent = category;
    heartsEl.textContent = "❤️".repeat(MAX_WRONG - wrong) + "🖤".repeat(wrong);
    winsEl.textContent = stats.wins;
    streakEl.textContent = stats.streak;

    for (let i = 0; i < MAX_WRONG; i++) {
      $("p" + i).classList.toggle("show", i < wrong);
    }

    wordEl.innerHTML = "";
    for (const ch of answer) {
      const slot = document.createElement("div");
      slot.className = "slot";
      if (ch === " ") {
        slot.style.borderBottom = "none";
      } else if (guessed.has(ch)) {
        slot.textContent = ch;
      } else if (over) {
        slot.textContent = ch;
        slot.classList.add("revealed-miss");
      }
      wordEl.appendChild(slot);
    }

    keyboardEl.innerHTML = "";
    for (const row of KEY_ROWS) {
      const krow = document.createElement("div");
      krow.className = "krow";
      for (const letter of row) {
        const key = document.createElement("button");
        key.className = "key";
        key.textContent = letter;
        if (guessed.has(letter)) {
          key.disabled = true;
          key.classList.add(answer.includes(letter) ? "hit" : "miss");
        } else if (over) {
          key.disabled = true;
        }
        key.addEventListener("click", () => guess(letter));
        krow.appendChild(key);
      }
      keyboardEl.appendChild(krow);
    }
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && over) { newGame(); return; }
    if (/^[a-zA-Z]$/.test(e.key)) guess(e.key.toUpperCase());
  });
  playAgainBtn.addEventListener("click", newGame);

  newGame();
})();
</script>
</body>
</html>
